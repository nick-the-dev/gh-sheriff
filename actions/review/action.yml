name: Sheriff review
description: Review one pull request head (cheap first pass, then the final reviewer), read-only, and save the verdict as an artifact.
inputs:
  pr:
    description: Pull request number
    required: true
  head:
    description: The head sha the reserve job counted this round for
    required: true
  base:
    description: The merge base the reserve job found for that head
    required: true
  counts:
    description: The rounds already used on the pull request, as JSON from the reserve job
    required: true
  final:
    description: Final reviewer as provider:model (a bare model means Claude)
    required: false
    default: claude:claude-opus-5-5
  first-pass:
    description: Cheap first-pass reviewer as provider:model; empty for none
    required: false
    default: ""
  first-rounds:
    description: Cheap first-pass reviews per pull request before only the final reviewer runs
    required: false
    default: "3"
  final-rounds:
    description: Final reviews per pull request before a person decides
    required: false
    default: "3"
  claude-token:
    description: Claude Code OAuth token from claude setup-token (for claude reviewers)
    required: false
    default: ""
  opencode-key:
    description: OpenCode API key (for opencode reviewers)
    required: false
    default: ""
  plan-issue:
    description: The task issue whose plan the reserve job keyed this round to (0 when none)
    required: false
    default: "0"
  plan-version:
    description: The plan version the reserve job keyed this round to (0 when none)
    required: false
    default: "0"
  app:
    description: The gate App's slug from the reserve job (whose plan comments count)
    required: false
    default: ""
outputs:
  verdict:
    description: clean or blocked, empty when nothing was reviewed
    value: ${{ steps.verdict.outputs.verdict }}
runs:
  using: composite
  steps:
    - name: Clear an earlier job's review and plan files (a persistent workspace keeps them)
      shell: bash
      run: rm -rf review plan
    - name: Check out the pull request head as data
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: refs/pull/${{ inputs.pr }}/head
        path: pr
        fetch-depth: 0
        persist-credentials: false
    - name: Check out the default branch for the project's rules
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.repository.default_branch }}
        path: base
        fetch-depth: 1
        persist-credentials: false
    - name: Remove symbolic links from the checkouts
      shell: bash
      run: find pr base -type l -delete
    - name: Prepare the review input
      id: prepare
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        PR: ${{ inputs.pr }}
        HEAD_SHA: ${{ inputs.head }}
        BASE_SHA: ${{ inputs.base }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        PLAN_ISSUE: ${{ inputs.plan-issue }}
        PLAN_VERSION: ${{ inputs.plan-version }}
        APP: ${{ inputs.app }}
        SHERIFF: ${{ github.action_path }}/../..
      run: |
        python3 -I "$SHERIFF/scripts/review.py" prepare --pr "$PR" --checkout pr --out review --default-branch "$DEFAULT_BRANCH" \
          --head "$HEAD_SHA" --base "$BASE_SHA" --plan-issue "$PLAN_ISSUE" --plan-version "$PLAN_VERSION" --app "$APP"
    - name: Set up Node.js for the reviewer CLIs (self-hosted runners may not have it)
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
    - name: Review (cheap first pass, then the final reviewer; read-only, no shell)
      id: verdict
      if: steps.prepare.outputs.skip == ''
      shell: bash
      env:
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-token }}
        OPENCODE_API_KEY: ${{ inputs.opencode-key }}
        PR: ${{ inputs.pr }}
        HEAD_SHA: ${{ inputs.head }}
        BASE_SHA: ${{ inputs.base }}
        COUNTS: ${{ inputs.counts }}
        FIRST_PASS: ${{ inputs.first-pass }}
        FINAL: ${{ inputs.final }}
        FIRST_ROUNDS: ${{ inputs.first-rounds }}
        FINAL_ROUNDS: ${{ inputs.final-rounds }}
        PLAN_VERSION: ${{ inputs.plan-version }}
        SHERIFF: ${{ github.action_path }}/../..
      run: |
        python3 -I "$SHERIFF/scripts/review.py" run --pr "$PR" --head "$HEAD_SHA" --base "$BASE_SHA" --checkout pr \
          --workdir . --prompt "$SHERIFF/prompts/review.md" --first-pass "$FIRST_PASS" --final "$FINAL" \
          --first-rounds "$FIRST_ROUNDS" --final-rounds "$FINAL_ROUNDS" --out review/verdict.json --counts "$COUNTS" \
          --plan-version "$PLAN_VERSION"
    - name: Keep the verdict for the posting job
      if: steps.prepare.outputs.skip == ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: sheriff-verdict
        path: review/verdict.json
        retention-days: 7
        if-no-files-found: error
