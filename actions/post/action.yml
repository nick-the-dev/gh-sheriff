name: Sheriff post
description: Publish a saved Sheriff verdict as the gate App's Review check run (replacing the round's reservation review with the verdict) and refresh Merge gate.
inputs:
  app-id:
    description: The Sheriff gate App id
    required: true
  app-key:
    description: The Sheriff gate App private key, base64
    required: true
  review-id:
    description: The reservation review to replace with the verdict (empty to post a new review)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Fetch the verdict
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: sheriff-verdict
        path: review
    - name: Post it and refresh the statuses
      shell: bash
      env:
        GH_REPO: ${{ github.repository }}
        AGENT_APP_ID: ${{ inputs.app-id }}
        AGENT_APP_KEY_B64: ${{ inputs.app-key }}
        SHERIFF: ${{ github.action_path }}/../..
        SHERIFF_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        REVIEW_ID: ${{ inputs.review-id }}
      run: |
        set -euo pipefail
        PR=$(python3 -I -c 'import json; print(int(json.load(open("review/verdict.json"))["pr"]))')
        python3 -I "$SHERIFF/scripts/app-token.py" --repo "$GH_REPO" --permission checks=write --permission pull_requests=write --permission statuses=write \
          --permission issues=read --permission contents=read --permission actions=read -- \
          bash -c 'python3 -I "$SHERIFF/scripts/review.py" post --verdict review/verdict.json --default-branch "$SHERIFF_DEFAULT_BRANCH" --review-id "$REVIEW_ID" && python3 -I "$SHERIFF/scripts/gate-status.py" --pr "$1"' _ "$PR"
